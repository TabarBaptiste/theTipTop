sonar.projectKey=thetiptop
sonar.projectName=thetiptop
sonar.sources=api/src,webapp/src
# Les tests webapp sont nommes *.test.tsx la ou l'API utilise *.spec.ts. Sans
# les deux motifs, les tests du front etaient analyses comme du code de
# production : repetitifs par nature, ils pesaient sur la duplication, et
# comme Jest ne les inclut pas dans le lcov, ils comptaient en plus comme
# non couverts.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/.prisma/**,**/dist/**,**/cypress/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/*.cy.ts,**/prisma/**
# Les deux configurations Jest retirent volontairement ces fichiers de la
# couverture : les pages App Router et le middleware sont couverts par les
# tests E2E Cypress, et main.ts / *.module.ts / index.ts ne portent que du
# bootstrap ou du cablage DI. Absents du lcov, ils etaient comptes a 0 % par
# le Zero Coverage Sensor de Sonar et faisaient echouer le quality gate sur
# la couverture du new code. Cette liste doit rester alignee sur les
# `collectCoverageFrom` de api/jest.config.js et webapp/jest.config.js.
sonar.coverage.exclusions=webapp/src/app/**,webapp/src/proxy.ts,api/src/main.ts,api/src/**/*.module.ts,api/src/**/index.ts,**/*.d.ts
sonar.javascript.node.maxspace=4096
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,webapp/coverage/lcov.info
sonar.junit.reportPaths=api/junit.xml,webapp/junit.xml
